app = "afnurlbot"
primary_region = "sin" # Region Singapore (bisa diubah, mis: hkg untuk hongkong)

[build]
  # Menggunakan Dockerfile yang sudah ada di repository

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
  
