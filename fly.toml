# fly.toml app configuration file generated for vdbot on 2026-11-17T14:15:36Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'vdbot'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[restart]]
  policy = 'on-failure'
  processes = ['app']
