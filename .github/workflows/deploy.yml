name: Deploy to Fly.io
on:
  push:
    branches: [ master, main ]

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          flyctl apps create afnurlbot || true
          flyctl deploy --remote-only
